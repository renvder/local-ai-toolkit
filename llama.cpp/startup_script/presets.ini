; ---------------------------------------------------------------
; Custom preset file for llama-server.
;
; Important: section names must match the model names that
; llama-server reports exactly. Look at the "Available models"
; section in the startup log and copy the names from there.
; [*] wildcard sections are NOT recognized and will result in
; "Loaded 0 custom model presets".
;
; Common parameters (ctx-size / cache-type, etc.) are now passed
; from the command line by the launcher script.
; Use this file only for per-model overrides.
; Leave the file empty or delete it if you do not need overrides.
; ---------------------------------------------------------------

; 27B dense model is a bit tight on 24 GB cards; tighten context a little:
[Qwen3.8-27B]
ctx-size = 16384

; MoE models have fewer active parameters, so they can afford a longer context:
; [Qwen3.6-35B-A3B-UD-Q8_K_XL]
; ctx-size = 32768