; ---------------------------------------------------------------
; llama-server 的自定义 preset 文件。
;
; 重要：段名必须和 llama-server 识别出的模型名完全一致。
; 启动日志里 "Available models" 那一段列的就是可用名字，照抄。
; [*] 这种通配段名它不认，写了会得到 "Loaded 0 custom model presets"。
;
; 通用参数（ctx-size / cache-type 等）现在由启动脚本从命令行传，
; 这里只用来给个别模型做单独覆盖。不需要就整个文件留空或删掉。
; ---------------------------------------------------------------

; 27B 稠密模型在 24G 卡上比较挤，单独把上下文收紧一点：
[Qwen3.8-27B]
ctx-size = 16384

; MoE 模型激活参数少，可以给长一些：
; [Qwen3.6-35B-A3B-UD-Q8_K_XL]
; ctx-size = 32768
